name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: links + structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every case study has the sections the README promises
        run: |
          for file in case-studies/*.md; do
            echo "checking $file"
            for heading in "## The problem" "## What it does" "## Architecture" "## Design decisions" "## Data and privacy" "## What I would do differently" "## Why this is a case study and not a repository"; do
              grep -qF "$heading" "$file" || { echo "MISSING in $file: $heading"; exit 1; }
            done
          done

      - name: Every case study is linked from the README
        run: |
          for file in case-studies/*.md; do
            grep -qF "$(basename "$file")" README.md || { echo "NOT LINKED: $file"; exit 1; }
          done

      - name: No link points at a file that is not here
        run: |
          # Resolved from the directory of the file holding the link, not from the repo root:
          # a relative link inside case-studies/ was looked up at the root, so the first one
          # added would have failed here while being perfectly correct. The pattern also no
          # longer requires a .md suffix, so LICENSE is covered.
          fail=0
          while IFS= read -r hit; do
            src="${hit%%::*}"
            target="${hit##*::}"
            [ -e "$(dirname "$src")/$target" ] || { echo "BROKEN link in $src -> $target"; fail=1; }
          done < <(grep -rEo '\]\([a-zA-Z0-9._/-]+\)' --include='*.md' README.md case-studies/ \
                   | sed -E 's/:\]\(/::/; s/\)$//')
          exit $fail

      # Rule 2 of CLAUDE.md, enforced rather than trusted: this repository publishes no
      # identifier that could locate a person or a matter. No denylist of brand terms is
      # committed here on purpose — a list of what must never be published is itself a thing
      # that must never be published, and that mistake has already been made once. Brand
      # terms are checked before every push by the local release-check; what CI can check
      # without a list is the shape of an identifier.
      - name: No Brazilian identifier reaches a published file
        run: |
          fail=0
          check() {
            if grep -rnE "$1" --include='*.md' README.md case-studies/; then
              echo "FOUND: $2"; fail=1
            fi
          }
          check '[0-9]{3}[.][0-9]{3}[.][0-9]{3}-[0-9]{2}' 'a CPF-shaped string'
          check '[0-9]{2}[.][0-9]{3}[.][0-9]{3}/[0-9]{4}-[0-9]{2}' 'a CNPJ-shaped string'
          check '[0-9]{7}-[0-9]{2}[.][0-9]{4}[.][0-9][.][0-9]{2}[.][0-9]{4}' 'a CNJ case number'
          check 'OAB[/ ]?[A-Z]{2}[ ]?[0-9]{3,6}' 'an OAB registration'
          exit $fail

      - name: No source system was copied in here
        run: |
          ! find . -path ./.git -prune -o \( -name "*.py" -o -name "*.ts" -o -name "*.tsx" -o -name "*.sql" -o -name "*.prisma" \) -print | grep .

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
