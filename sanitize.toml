[brand]
# Employer, client and product names. "RENAVE" and "SERPRO" are deliberately NOT here: they
# name a public federal register and the state-owned company that operates it, which is
# public infrastructure rather than anybody's brand, and the domain is unintelligible
# without them. The product built on top of it is not named.
terms = ["STG", "STGLaw", "Schmeisser", "Terra Gomes", "stglaw", "RenavePro", "Renavepro", "Cipasa", "Nova Cipasa", "Asaas", "ELAW", "AUTOJUR", "Railway", "SMD CAPITAL"]

[domains]
internal = ["stglaw.com.br", "stgadvogados.com.br", "renavepro.com"]

[hosts]
suffixes = ["sharepoint.com", "onmicrosoft.com", "railway.app", "estaleiro.serpro.gov.br"]

[allow]
paths = []
